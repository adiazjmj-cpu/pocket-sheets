/* ---------------- file menu & file input ---------------- */
let pendingImport=null; // "xlsx" | "csv" | "weave"
function openFilePicker(accept,kind){
  pendingImport=kind;
  // v1.1: in the Tauri desktop shell the webview's <input type="file">
  // picker does not deliver the selected file on macOS, so import goes
  // through the shell's native Open dialog and the read commands instead.
  // In a plain browser this branch is skipped and the file input runs.
  if(window.__TAURI__ && window.__TAURI__.dialog && window.__TAURI__.core){ importViaTauri(kind); return; }
  const fi=$("#fileInput");
  fi.accept=accept; fi.value="";
  fi.click();
}
// v1.1: Tauri native import. Reads the picked file through the shell's
// read commands and hands the content to applyImport — the same processing
// the browser file-input path uses.
async function importViaTauri(kind){
  try{
    const dialog=window.__TAURI__.dialog, core=window.__TAURI__.core;
    if(!dialog||!dialog.open||!core||!core.invoke) throw new Error("Tauri dialog unavailable");
    const filters = kind==="xlsx"
      ? [{name:"Excel workbook", extensions:["xlsx"]}]
      : kind==="csv"
      ? [{name:"CSV", extensions:["csv"]}]
      : [{name:"Pocket Sheets workbook", extensions:["weave"]}];
    const picked=await dialog.open({ multiple:false, filters });
    if(!picked) return;
    const path=Array.isArray(picked)?picked[0]:picked;
    const name=path.split(/[\\/]/).pop()||"file";
    if(kind==="xlsx"){
      const b64=await core.invoke("read_bytes_file",{path});
      applyImport(kind, name, base64ToBytes(b64));
    }else{
      const text=await core.invoke("read_text_file",{path});
      applyImport(kind, name, text);
    }
  }catch(e){
    toast("Import failed: "+(e&&e.message?e.message:e));
  }
}
function handleFilePicked(file){
  if(!file) return;
  const kind=pendingImport; pendingImport=null;
  const reader=new FileReader();
  reader.onload=()=>{
    try{
      if(kind==="xlsx") applyImport(kind, file.name, new Uint8Array(reader.result));
      else applyImport(kind, file.name, typeof reader.result==="string"?reader.result:utf8Decode(new Uint8Array(reader.result)));
    }catch(e){
      toast("Import failed: "+(e&&e.message?e.message:e));
    }
  };
  reader.onerror=()=>toast("Could not read that file.");
  if(kind==="xlsx") reader.readAsArrayBuffer(file);
  else reader.readAsText(file);
}
// Shared import processing: data is a Uint8Array for "xlsx", a string for
// "csv" and "weave". Both the browser file-input path and the Tauri native
// path feed through here.
function applyImport(kind, name, data){
  if(kind==="xlsx"){
    const sheets=importXlsxBytes(data);
    pushUndo();
    state.sheets=sheets;
    state.activeSheet=0;
    state.name=name.replace(/\.xlsx$/i,"");
    sel={r:0,c:0,r1:0,c1:0,r2:0,c2:0};
    renderAll(); scheduleSave();
    toast("Imported "+sheets.length+" sheet(s) from "+name+".");
  } else if(kind==="csv"){
    const rows=parseCsv(data);
    importRowsIntoSheet(rows);
    toast("Imported "+rows.length+" row(s) from "+name+".");
  } else if(kind==="weave"){
    const wb=importWeaveText(data);
    pushUndo();
    state.sheets=wb.sheets; state.name=wb.name; state.activeSheet=0;
    sel={r:0,c:0,r1:0,c1:0,r2:0,c2:0};
    renderAll(); scheduleSave();
    toast("Imported workbook “"+wb.name+"” ("+wb.sheets.length+" sheet(s)).");
  }
}
function wireFileMenu(){
  const menu=$("#fileMenu");
  $("#fileBtn").onclick=(e)=>{
    e.stopPropagation();
    menu.classList.toggle("on");
  };
  document.addEventListener("click",(e)=>{
    if(!menu.contains(e.target)&&e.target.id!=="fileBtn") menu.classList.remove("on");
  });
  menu.querySelectorAll("button[data-act]").forEach(b=>{
    b.onclick=async()=>{
      menu.classList.remove("on");
      const act=b.dataset.act;
      const base=(state.name||"workbook").replace(/[\\/:*?"<>|]/g,"_");
      if(act==="import-xlsx") openFilePicker(".xlsx,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet","xlsx");
      else if(act==="import-csv-file") openFilePicker(".csv,text/csv","csv");
      else if(act==="import-csv-paste") showPasteCsv();
      else if(act==="import-weave") openFilePicker(".weave,text/plain","weave");
      else if(act==="export-xlsx"){ if(await downloadBytes(buildXlsxBytes(), base+".xlsx", "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet")) toast("Exported .xlsx"); }
      else if(act==="export-csv"){ if(await downloadText(exportCsvText(), base+"-"+activeSheet().name+".csv", "text/csv")) toast("Exported .csv"); }
      else if(act==="export-weave"){ if(await downloadText(exportWeaveText(), base+".weave", "text/plain")) toast("Exported .weave"); }
      else if(act==="export-backup") exportBackup();
      else if(act==="storage") showStorage();
      else if(act==="about") showAbout();
    };
  });
}

/* ---------------- grid events ---------------- */
function wireGrid(){
  const table=$("#grid");
  const wrap=$("#gridWrap");
  table.addEventListener("mousedown",(e)=>{
    const td=e.target.closest("td");
    const th=e.target.closest("th");
    if(th&&th.dataset.col!=null&&e.target===th){
      // column header: start resize if near right edge
      const rect=th.getBoundingClientRect();
      if(e.clientX>rect.right-6){
        e.preventDefault();
        colResize={col:+th.dataset.col,startX:e.clientX,startW:th.offsetWidth};
        return;
      }
    }
    if(!td) return;
    if(e.detail===2){ openEditor(+td.dataset.r,+td.dataset.c,null); return; }
    const r=+td.dataset.r, c=+td.dataset.c;
    if(e.shiftKey) setSelection(r,c,true);
    else setSelection(r,c,false);
  });
  document.addEventListener("mousemove",(e)=>{
    if(!colResize) return;
    const w=clamp(colResize.startW+(e.clientX-colResize.startX),40,600);
    activeSheet().colWidths[colResize.col]=Math.round(w);
    renderGrid();
  });
  document.addEventListener("mouseup",()=>{
    if(colResize){ colResize=null; scheduleSave(); }
  });
  table.addEventListener("dblclick",(e)=>{
    const td=e.target.closest("td");
    if(td) openEditor(+td.dataset.r,+td.dataset.c,null);
  });
  const ed=$("#cellEditor");
  ed.addEventListener("keydown",(e)=>{
    if(e.key==="Enter"){ e.preventDefault(); const v=ed.value; closeEditor(true); moveSelection(e.shiftKey?-1:1,0,false); }
    else if(e.key==="Tab"){ e.preventDefault(); closeEditor(true); moveSelection(0,e.shiftKey?-1:1,false); }
    else if(e.key==="Escape"){ e.preventDefault(); closeEditor(false); }
    else if(e.key==="ArrowDown"||e.key==="ArrowUp"){ /* let the editor keep the caret */ }
    e.stopPropagation();
  });
  ed.addEventListener("blur",()=>{ if(editing) closeEditor(true); });
  wrap.addEventListener("scroll",()=>{ if(editing) closeEditor(true); },true);
  // paste into grid
  document.addEventListener("paste",(e)=>{
    if(editing) return;
    const tag=(document.activeElement&&document.activeElement.tagName)||"";
    if(tag==="INPUT"||tag==="TEXTAREA"||tag==="SELECT") return;
    const text=(e.clipboardData||window.clipboardData)&&e.clipboardData.getData("text");
    if(!text) return;
    e.preventDefault();
    pasteTsv(text,sel.r,sel.c);
  });
  // formula bar
  const fi=$("#formulaInput");
  fi.addEventListener("focus",()=>{ if(!editing) openEditor(sel.r,sel.c,null); });
  fi.addEventListener("keydown",(e)=>{
    if(e.key==="Enter"){ e.preventDefault(); const v=fi.value; closeEditor(false); commitEdit(v); moveSelection(1,0,false); }
    else if(e.key==="Escape"){ e.preventDefault(); updateFormulaBar(); fi.blur(); }
    e.stopPropagation();
  });
  fi.addEventListener("input",()=>{
    if(editing){ const ed2=$("#cellEditor"); if(ed2) ed2.value=fi.value; }
  });
}
function wireKeyboard(){
  document.addEventListener("keydown",(e)=>{
    const tag=(document.activeElement&&document.activeElement.tagName)||"";
    const inField=tag==="INPUT"||tag==="TEXTAREA"||tag==="SELECT";
    if(editing) return; // editor handles its own keys
    if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==="z"&&!e.shiftKey){ e.preventDefault(); doUndo(); return; }
    if((e.ctrlKey||e.metaKey)&&(e.key.toLowerCase()==="y"||(e.key.toLowerCase()==="z"&&e.shiftKey))){ e.preventDefault(); doRedo(); return; }
    if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==="c"){ copySelection(); return; }
    if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==="f"){ e.preventDefault(); showFind(); return; }
    if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==="s"){ e.preventDefault(); saveNow(); toast("Saved."); return; }
    if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==="b"){ e.preventDefault(); const cell=getCell(activeSheet(),sel.r,sel.c); applyStyleToSelection({b:!(cell&&cell.s&&cell.s.b)}); return; }
    if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==="i"){ e.preventDefault(); const cell=getCell(activeSheet(),sel.r,sel.c); applyStyleToSelection({i:!(cell&&cell.s&&cell.s.i)}); return; }
    if(inField) return;
    if(e.key==="Enter"){ e.preventDefault(); openEditor(sel.r,sel.c,null); return; }
    if(e.key==="F2"){ e.preventDefault(); openEditor(sel.r,sel.c,null); return; }
    if(e.key==="Delete"||e.key==="Backspace"){
      e.preventDefault();
      const sh=activeSheet(); pushUndo();
      for(let r=Math.min(sel.r1,sel.r2);r<=Math.max(sel.r1,sel.r2);r++)
        for(let c=Math.min(sel.c1,sel.c2);c<=Math.max(sel.c1,sel.c2);c++) delete sh.cells[cellKey(r,c)];
      recomputeSheet(sh); renderGrid(); renderCards(); scheduleSave();
      return;
    }
    if(e.key==="ArrowDown"||e.key==="ArrowUp"||e.key==="ArrowLeft"||e.key==="ArrowRight"){
      e.preventDefault();
      const d={ArrowDown:[1,0],ArrowUp:[-1,0],ArrowRight:[0,1],ArrowLeft:[0,-1]}[e.key];
      moveSelection(d[0],d[1],e.shiftKey);
      return;
    }
    if(e.key==="Tab"){ e.preventDefault(); moveSelection(0,e.shiftKey?-1:1,false); return; }
    if(e.key.length===1&&!e.ctrlKey&&!e.metaKey&&!e.altKey){
      e.preventDefault();
      openEditor(sel.r,sel.c,e.key);
      return;
    }
  });
}
function wireToolbar(){
  $("#undoBtn").onclick=doUndo;
  $("#redoBtn").onclick=doRedo;
  $("#boldBtn").onclick=()=>{
    const cell=getCell(activeSheet(),sel.r,sel.c);
    const cur=cell&&cell.s&&cell.s.b;
    applyStyleToSelection({b:!cur});
  };
  $("#italicBtn").onclick=()=>{
    const cell=getCell(activeSheet(),sel.r,sel.c);
    const cur=cell&&cell.s&&cell.s.i;
    applyStyleToSelection({i:!cur});
  };
  $("#fillColor").oninput=(e)=>applyStyleToSelection({fill:e.target.value});
  $("#textColor").oninput=(e)=>applyStyleToSelection({color:e.target.value});
  $("#numFmt").onchange=(e)=>{ if(e.target.value) applyStyleToSelection({fmt:e.target.value}); };
  $("#borderSel").onchange=(e)=>{
    const v=e.target.value; if(!v) return;
    const sh=activeSheet();
    const r1=Math.min(sel.r1,sel.r2), r2=Math.max(sel.r1,sel.r2);
    const c1=Math.min(sel.c1,sel.c2), c2=Math.max(sel.c1,sel.c2);
    pushUndo();
    for(let r=r1;r<=r2;r++) for(let c=c1;c<=c2;c++){
      const edge = v==="all" || r===r1||r===r2||c===c1||c===c2;
      if(!edge) continue;
      const k=cellKey(r,c);
      if(!sh.cells[k]) sh.cells[k]={v:"",f:null,s:{}};
      if(!sh.cells[k].s) sh.cells[k].s={};
      sh.cells[k].s.border="thin";
    }
    renderGrid(); scheduleSave();
    e.target.value="";
  };
  $("#mergeBtn").onclick=mergeSelection;
  $("#unmergeBtn").onclick=unmergeSelection;
  $("#insRowBtn").onclick=()=>{ insertRow(sel.r); toast("Row inserted above row "+(sel.r+1)+"."); };
  $("#delRowBtn").onclick=()=>{ deleteRows(Math.min(sel.r1,sel.r2),Math.max(sel.r1,sel.r2)); toast("Row(s) deleted."); };
  $("#insColBtn").onclick=()=>{ insertCol(sel.c); toast("Column inserted left of "+colToLetter(sel.c)+"."); };
  $("#delColBtn").onclick=()=>{ deleteCols(Math.min(sel.c1,sel.c2),Math.max(sel.c1,sel.c2)); toast("Column(s) deleted."); };
  $("#sortAscBtn").onclick=()=>sortSelection("asc");
  $("#sortDescBtn").onclick=()=>sortSelection("desc");
  $("#filterBtn").onclick=showFilter;
  $("#clearFilterBtn").onclick=clearFilters;
  $("#findBtn").onclick=showFind;
  $("#clearBtn").onclick=()=>{
    const sh=activeSheet(); pushUndo();
    for(let r=Math.min(sel.r1,sel.r2);r<=Math.max(sel.r1,sel.r2);r++)
      for(let c=Math.min(sel.c1,sel.c2);c<=Math.max(sel.c1,sel.c2);c++) delete sh.cells[cellKey(r,c)];
    recomputeSheet(sh); renderGrid(); renderCards(); scheduleSave();
  };
  $("#addSheetBtn").onclick=()=>addSheet();
  $("#gridViewBtn").onclick=()=>setView("grid");
  $("#cardsViewBtn").onclick=()=>setView("cards");
  $("#helpBtn").onclick=showHelp;
  $("#wbName").addEventListener("change",(e)=>{
    state.name=e.target.value.trim()||"Untitled workbook";
    e.target.value=state.name; scheduleSave();
  });
  $("#modalOverlay").addEventListener("click",(e)=>{ if(e.target.id==="modalOverlay") closeModal(); });
  document.addEventListener("keydown",(e)=>{ if(e.key==="Escape"&&$("#modalOverlay").classList.contains("on")) closeModal(); });
  $("#fileInput").addEventListener("change",(e)=>{ if(e.target.files&&e.target.files[0]) handleFilePicked(e.target.files[0]); });
}
function setView(mode){
  viewMode=mode;
  $("#gridViewBtn").classList.toggle("active",mode==="grid");
  $("#cardsViewBtn").classList.toggle("active",mode==="cards");
  $("#gridWrap").style.display=mode==="grid"?"":"none";
  renderCards();
  if(mode==="grid") renderGrid();
}

/* ---------------- init ---------------- */
async function init(){
  wireFileMenu(); wireGrid(); wireKeyboard(); wireToolbar();
  const saved=await loadSaved();
  if(saved){
    state=normaliseWorkbook(saved);
    state.sheets.forEach(recomputeSheet);
  } else {
    state=newWorkbook();
    recomputeAll();
  }
  setSaveState(storeMode==="indexedDB"?"Saved":"Saved (limited storage)", storeMode!=="indexedDB");
  renderAll();
}
/* Test hooks: stable API for jsdom tests (not part of the UI). */
window.__sheets={
  get state(){ return state; },
  set state(v){ state=v; },
  get sel(){ return sel; },
  newWorkbook:newWorkbook, newSheet:newSheet,
  setCellRaw:setCellRaw, getCell:getCell, displayValue:displayValue,
  evaluateFormula:evaluateFormula, recomputeAll:recomputeAll, recomputeSheet:recomputeSheet,
  parseFormula:parseFormula, tokenizeFormula:tokenizeFormula,
  importXlsxBytes:importXlsxBytes, buildXlsxBytes:buildXlsxBytes,
  exportCsvText:exportCsvText, importRowsIntoSheet:importRowsIntoSheet,
  exportWeaveText:exportWeaveText, importWeaveText:importWeaveText,
  sortSelection:sortSelection, switchSheet:switchSheet, addSheet:addSheet,
  setSelection:setSelection, commitEdit:commitEdit, selectionTsv:selectionTsv,
  applyFilter:applyFilter, clearFilters:clearFilters,
  mergeSelection:mergeSelection, unmergeSelection:unmergeSelection,
  findNext:findNext, doUndo:doUndo, doRedo:doRedo, renameSheet:renameSheet, deleteSheet:deleteSheet,
  renderAll:renderAll, parseCsv:parseCsv, readZip:readZip, writeZip:writeZip,
  colToLetter:colToLetter, letterToCol:letterToCol, parseRef:parseRef, a1:a1,
  dateToSerial:dateToSerial, serialToDate:serialToDate,
  downloadBytes:downloadBytes, downloadText:downloadText,
  openFilePicker:openFilePicker, importViaTauri:importViaTauri, applyImport:applyImport
};
if(document.readyState==="loading") document.addEventListener("DOMContentLoaded",init);
else init();
</script>
